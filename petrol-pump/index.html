const shotsEl = document.getElementById('shots');

function applyMaterials() {

}
function go(i) {

  fly = { t0: performance.now(), fp: camera.position.clone(), ft: controls.target.clone(), tp: new V3(...s.p), tt: new V3(...s.t) };

}
const $ = id => document.getElementById(id);
$('explode').oninput = e => { state.explode = +e.target.value; };
function tg(id, k, fn) { $(id).onclick = () => { state[k] = !state[k]; $(id).classList.toggle('on', state[k]); fn && fn(); }; }
tg('xray', 'xray', applyMaterials); tg('play', 'play'); tg('orbit', 'orbit', () => controls.autoRotate = !!state.orbit); state.orbit = true;
tg('tags', 'tags', applyMaterials);
controls.addEventListener('start', () => { if (state.orbit) { state.orbit = false; controls.autoRotate = false; $('orbit').classList.remove('on'); } });

// ---------------------------------------------------------------- FILM: one continuous camera, no hard cuts; POV: ride the fuel, feel through the port
// key: t (s), p camera, q look-at, f fov, s shot to switch to (35% into the move), a = animation clock (s)
const FK = [
  { t: 0,    p: [1.9, 1.4, 6.8],            q: [0.5, 0.65, 0.05],        f: 34, s: 0, a: 0.5 },
  { t: 4,    p: [0.3, 0.8, 5.0],            q: [-0.3, 0.2, 0.1],         f: 36 },
  { t: 7,    p: [DX + 0.9, -0.35, 3.6],     q: [DX - 0.05, 0.05, 0],     f: 44, s: 1 },
  { t: 10,   p: [DX + 1.0, 1.1, 2.6],       q: [DX, 1.0, 0],             f: 34, s: 2 },
  { t: 13,   p: [0.5, 1.0, 2.6],             q: [-0.3, 0.75, 0.3],        f: 34, s: 3 },
  { t: 16,   p: [0.05, 0.98, 0.7],          q: NL(-0.2, 0, 0),           f: 46 },
  { t: 18.5, p: NL(-0.3, 0.02, 0.05),       q: NL(0.1, 0, 0),            f: 60, s: 4, a: 1.0 },
  { t: 21,   p: NL(0.03, 0.07, 0.21),       q: NL(-0.026, 0.01, 0),      f: 55, s: 5 },
  { t: 24,   p: NL(0.12, 0.07, 0.18),        q: NL(0.24, 0.012, 0),       f: 50, s: 6, a: 3.4 },
  { t: 27,   p: NL(0.1, 0.08, 0.2),         q: NL(-0.03, 0.058, 0),      f: 50, s: 7, a: 5.4 },
  { t: 30,   p: NL(-0.03, 0.065, 0.13),     q: NL(-0.085, 0.032, 0),     f: 50, s: 8, a: 6.2 },
  { t: 33,   p: NL(0.0, 0.05, 0.17),        q: NL(-0.07, 0, 0),          f: 50, s: 9, a: 6.45 },
  { t: 36,   p: [0.1, 1.3, 2.1],            q: [-0.1, 0.75, 0.3],        f: 40, s: 10, a: 8 },
  { t: 40,   p: [2.1, 1.4, 6.6],            q: [0.5, 0.65, 0.05],        f: 34, s: 0 },
  { t: 43,   p: [2.4, 1.5, 6.8],            q: [0.5, 0.65, 0.05],        f: 34 },
];
const FP = new THREE.CatmullRomCurve3(FK.map(k => new V3(...k.p)), false, 'centripetal', 0.5);
const FQ = new THREE.CatmullRomCurve3(FK.map(k => new V3(...k.q)), false, 'centripetal', 0.5);
const film = { on: false, t: 0, last: -1 };
function filmAt(t) {
  let i = 0; while (i < FK.length - 2 && t >= FK[i + 1].t) i++;
  const a = FK[i], b = FK[i + 1], s = Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t)));
  const e = 0.45 * s + 0.55 * ease(s);
  const u = (i + e) / (FK.length - 1);
  camera.position.copy(FP.getPoint(u)); controls.target.copy(FQ.getPoint(u));
  camera.fov = a.f + (b.f - a.f) * e; camera.updateProjectionMatrix();
  for (let k = 0; k < FK.length; k++) {
    const sw = k === 0 ? 0 : FK[k - 1].t + 0.35 * (FK[k].t - FK[k - 1].t);
    if (FK[k].s !== undefined && t >= sw && film.last < sw) { go(FK[k].s); fly = null; }
    if (FK[k].a !== undefined) { const at = k === 0 ? 0 : FK[k - 1].t + 0.6 * (FK[k].t - FK[k - 1].t); if (t >= at && film.last < at) T = FK[k].a; }
  }
  film.last = t;
}
function filmStart() { film.on = true; film.t = 0; film.last = -1; state.play = true; controls.autoRotate = false; controls.minDistance = 0.01; controls.enabled = false; if (!state.xray) { state.xray = true; $('xray').classList.add('on'); } $('film').classList.add('on'); }
function filmStop() { film.on = false; controls.enabled = true; controls.minDistance = 0.03; $('film').classList.remove('on'); }
$('film').onclick = () => film.on ? filmStop() : filmStart();

// ---------------------------------------------------------------- animation (12 s loop): flowing -> fuel rises -> covers the hole -> suction -> latch drops -> valve shuts
const clock = new THREE.Clock(); let T = 0, ph = 0, flowK = 1, shown = 0, lastShown = -1;
function ease(x) { return x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x); }
const TUBE_TOP = 0.078;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); if (state.play) T += dt;
  const t = T % 12;
  const drop = ease((t - 11) / 0.8);
  const rise = ease((t - 2.5) / 3.0) * (1 - drop);
  const sucked = ease((t - 5.4) / 1.1) * (1 - drop);
  const rel = (t > 6.5 ? ease((t - 6.5) / 0.18) : 0) * (1 - drop);
  const airOn = (1 - ease((t - 5.2) / 0.3)) * (1 - 0) ; const air = drop > 0 ? Math.max(airOn, drop) : airOn;
  flowK += ((1 - rel) - flowK) * Math.min(1, dt * 8);
  ph = t < 6.5 ? t : 6.5 + 0.05 * (1 - Math.exp(-(t - 6.5) * 6)); if (t >= 11) ph = t - 11;   // deterministic: everything is a function of the animation clock
  // fuel column in the neck (tank -> up the pipe to the nozzle port)
  col.scale.y = Math.max(0.001, 0.31 * rise);
  // nozzle parts
  const open = 1 - rel;
  poppet.position.x = -0.05 - 0.012 * open;
  spring.position.x = -0.2; spring.scale.x = Math.max(0.01, (poppet.position.x - 0.006) + 0.2);
  const my = 0.056 + 0.014 * sucked; mem.position.y = my; rspring.position.y = my; rspring.scale.y = Math.max(0.002, 0.078 - my);
  pin.position.y = my - 0.015 + 0.0;
  const bx0 = 0.0065 - 0.0042 * rel, by0 = 0.034 - 0.003 * rel;
  ballL.position.set(-0.085 - bx0, by0, 0); ballR.position.set(-0.085 + bx0, by0, 0);
  plunger.position.y = -0.02 - 0.012 * rel;
  lever.rotation.z = 0.1 * open + 0.02; lever.position.y = -0.075 - 0.004 * rel;
  M.fuel.opacity = 0.25 + 0.3 * open; M.fuel.emissiveIntensity = 0.25 + 0.3 * open;
  nozF.userData.mat.opacity = open; hoseF.userData.mat.opacity = 0.2 + 0.8 * open;
  airF.userData.mat.opacity = Math.max(0, air);
  M.cyan.emissiveIntensity = 1.2 + 1.5 * sucked * (1 - rel);
  // particles
  FL.forEach(f => f.userData.tick(ph));
  // meter + display
  rotor.rotation.y = ph * 7; shown = ph * 1.9;
  if (Math.abs(shown - lastShown) > 0.004) { drawDisp(shown); lastShown = shown; }
  if (film.on) { film.t += dt; if (film.t > FK[FK.length - 1].t) filmStop(); else filmAt(film.t); }
  if (fly) { const k = Math.min(1, (performance.now() - fly.t0) / 1300), e2 = ease(k); camera.position.lerpVectors(fly.fp, fly.tp, e2); controls.target.lerpVectors(fly.ft, fly.tt, e2); if (k >= 1) fly = null; }
  scTex.offset.x = (clock.elapsedTime * 0.035) % 1; wallMat.opacity = WALLK * (0.45 + 0.35 * Math.min(1, (performance.now() - bdFade) / 700));
  { const Pp = dgeo.attributes.position; for (let i = 0; i < DN; i++) { let y = Pp.getY(i) + dt * 0.05; if (y > 3.2) y = 0; Pp.setY(i, y); Pp.setX(i, Pp.getX(i) + Math.sin(clock.elapsedTime * 0.3 + i) * dt * 0.01); } Pp.needsUpdate = true; }
  controls.update(); composer.render(); labelR.render(scene, camera);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight); });
const startShot = Math.max(0, SHOTS.findIndex(s => 'shot-' + s.id === location.hash.slice(1)));
go(startShot); animate();
window.__look = { camera, controls, applyMaterials, stopFly: () => { fly = null; }, setBd: (id, w) => drawBackdrop(id, w), film, filmStart, filmAt: t => { film.on = true; controls.enabled = false; controls.minDistance = 0.01; film.last = -1; for (let x = 0; x <= t; x += 0.05) filmAt(x); },
  // freeze at film time t with the animation clock set to a (used by the render board): the live loop no longer drives the camera
  freeze: (t, a) => { film.on = false; controls.enabled = false; controls.autoRotate = false; controls.minDistance = 0.01; film.last = -1; fly = null; for (let x = 0; x <= t; x += 0.05) filmAt(x); filmAt(t); T = a; state.play = false; },
  root, scene, floor, key, rim, setWall: k => { WALLK = k; }, renderer, wallMat, M, pov: (i, p, t, f = 50) => { go(i); fly = null; controls.autoRotate = false; state.orbit = false; controls.minDistance = 0.01; camera.position.set(...p); controls.target.set(...t); camera.fov = f; camera.updateProjectionMatrix(); controls.update(); }, fov: f => { camera.fov = f; camera.updateProjectionMatrix(); }, go, state, clean: on => document.body.classList.toggle('clean', on), seek: v => { T = v; }, SHOTS, FK, nz, NL };
